name: Publish Windows Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix (for example 1.0.20)
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate release version
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'.Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must use the form 1.2.3."
          }
          [xml]$project = Get-Content -LiteralPath NetPulseMonitor.csproj -Raw
          $projectVersion = [string]$project.Project.PropertyGroup.Version
          if ($projectVersion -ne $version) {
            throw "Requested version $version does not match project version $projectVersion."
          }
          $notes = "RELEASE-NOTES-$version.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) {
            throw "Missing $notes."
          }

      - name: Build and test
        shell: pwsh
        run: |
          dotnet restore NetPulseMonitor.csproj -p:NuGetAudit=false
          dotnet build NetPulseMonitor.csproj -c Release --no-restore -p:NuGetAudit=false
          dotnet run --project tests/NetPulseMonitor.ProtocolTests/NetPulseMonitor.ProtocolTests.csproj `
            -c Release -p:NuGetAudit=false

      - name: Install .NET MAUI Android workload
        run: dotnet workload install maui-android --skip-manifest-update

      - name: Package release
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'.Trim()
          $out = Join-Path $PWD 'release-assets'
          $publish = Join-Path $PWD 'release-publish'
          $bundle = Join-Path $PWD 'release-bundle'
          New-Item -ItemType Directory -Path $out, $publish, $bundle -Force | Out-Null

          dotnet publish NetPulseMonitor.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:NuGetAudit=false `
            -o $publish

          $builtExe = Join-Path $publish 'NetPulse Monitor.exe'
          if (-not (Test-Path -LiteralPath $builtExe -PathType Leaf)) {
            throw 'The Windows GUI executable was not created.'
          }

          dotnet restore mobile/NetPulse.Companion.App/NetPulse.Companion.App.csproj `
            -p:NuGetAudit=false
          dotnet publish mobile/NetPulse.Companion.App/NetPulse.Companion.App.csproj `
            -f net8.0-android `
            -c Release `
            -p:AndroidPackageFormats=apk `
            -p:NuGetAudit=false
          $apk = Get-ChildItem mobile/NetPulse.Companion.App/bin/Release/net8.0-android `
            -Recurse -Filter '*-Signed.apk' | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if (-not $apk) {
            throw 'The signed Companion APK was not created.'
          }

          $exeName = "NetPulse-Monitor-v$version-win-x64.exe"
          $zipName = "NetPulse-Monitor-v$version-win-x64.zip"
          $sourceName = "NetPulse-Monitor-v$version-source.zip"
          $apkName = "NetPulse-Monitor-Companion-Android-v$version.apk"
          Copy-Item -LiteralPath $builtExe -Destination (Join-Path $out $exeName)
          Copy-Item -LiteralPath $apk.FullName -Destination (Join-Path $out $apkName)
          Copy-Item -LiteralPath $builtExe -Destination (Join-Path $bundle 'NetPulse Monitor.exe')
          Copy-Item -LiteralPath $apk.FullName -Destination (Join-Path $bundle 'NetPulse-Monitor-Companion-Android.apk')
          Compress-Archive -Path (Join-Path $bundle '*') -DestinationPath (Join-Path $out $zipName)
          $sourceZip = Join-Path $out $sourceName
          git archive --format=zip --output=$sourceZip HEAD
          Copy-Item -LiteralPath "RELEASE-NOTES-$version.md" -Destination $out

          foreach ($file in Get-ChildItem -LiteralPath $out -File) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)" | Set-Content -LiteralPath ($file.FullName + '.sha256') -Encoding ascii
          }

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ inputs.version }}'.Trim()
          $tag = "v$version"
          $notes = "RELEASE-NOTES-$version.md"
          $assets = Get-ChildItem -LiteralPath release-assets -File | ForEach-Object FullName
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --title "NetPulse Monitor $tag" --notes-file $notes
            gh release upload $tag $assets --clobber
          }
          else {
            gh release create $tag $assets --target "${{ github.sha }}" `
              --title "NetPulse Monitor $tag" --notes-file $notes
          }

      - name: Retain workflow package
        uses: actions/upload-artifact@v4
        with:
          name: NetPulse-Monitor-v${{ inputs.version }}-Windows
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
