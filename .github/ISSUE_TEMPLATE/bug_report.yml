name: Bug report
description: Report a reproducible NetPulse problem without private data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Use **Security → Report a vulnerability**. Never paste passwords, SMS content, phone numbers, router tokens or unredacted logs.
  - type: input
    id: version
    attributes:
      label: NetPulse version
      placeholder: 1.0.6
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and display scale
      placeholder: Windows 11 24H2, 150%
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dashboard and ping monitoring
        - TP-Link MR600 connection
        - LTE History and recommendations
        - Cell Lock
        - SMS
        - Speed test
        - Diagnostics
        - Settings and layout
        - Installation or startup
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: State the expected result and the actual result.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open…\n2. Select…\n3. Observe…"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Redacted diagnostics
      description: Optional. Remove all private identifiers before pasting.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, tokens, phone numbers, SMS content, full cell IDs, public IPs and unrelated log entries.
          required: true
